name: Deploy to Ionos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Ionos
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.IONOS_USER }}
          server: ${{ secrets.IONOS_HOST }}
          password: ${{ secrets.IONOS_PASS }}
          local_path: |
            ./index.html
            ./live.html
            ./antcpu.css
            ./nav.js
            ./footer.js
            ./version.js
            ./antcpu.js
          remote_path: '/'
          sftp_only: true
