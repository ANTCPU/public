<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ANTCPU · FACTORY</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  background:#060608;
  color:rgba(255,255,255,0.92);
  font-family:'Space Mono', monospace;
  font-size:12px;
}
.container {
  height:100vh;
  display:flex;
  flex-direction:column;
}
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  letter-spacing:4px;
  font-size:13px;
}
.header-right {
  display:flex;
  align-items:center;
  gap:10px;
}
button {
  background:none;
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  padding:4px 8px;
  cursor:pointer;
  font-family:'Space Mono', monospace;
  font-size:11px;
}
button:hover { border-color:rgba(255,255,255,0.5); }
.summary {
  display:flex;
  gap:18px;
  padding:8px 14px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  font-size:11px;
  flex-wrap:wrap;
}
.status-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  margin-left:6px;
  background:#444;
}
.main {
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:auto 1fr 150px;
  overflow:hidden;
}
.panel {
  border-right:1px solid rgba(255,255,255,0.07);
  border-bottom:1px solid rgba(255,255,255,0.07);
  padding:10px;
  overflow:hidden;
}
.panel-title {
  color:rgba(255,255,255,0.32);
  margin-bottom:6px;
  letter-spacing:2px;
  font-size:10px;
}
.queue {
  grid-column:1 / 4;
  overflow:auto;
}
.card {
  border:1px solid rgba(255,255,255,0.07);
  padding:8px;
  margin-bottom:8px;
  transition:all 0.3s ease;
}
.card.fade {
  opacity:0;
  transform:translateX(20px);
}
.card.error { border-color:#ff4444; }
.agent { font-weight:bold; }
.badge {
  padding:2px 6px;
  border:1px solid rgba(255,255,255,0.2);
  margin-left:6px;
  font-size:10px;
}
.score { margin-left:6px; }
.payload {
  color:rgba(255,255,255,0.32);
  margin:6px 0;
  word-break:break-all;
}
.actions { display:flex; gap:6px; margin-top:6px; }
.btn-green { border-color:#00ffaa; color:#00ffaa; }
.btn-red { border-color:#ff4444; color:#ff4444; }
.btn-purple { border-color:#B080FF; color:#B080FF; }
.btn-loading { opacity:0.4; pointer-events:none; }
.harvester {
  grid-column:1 / 4;
  overflow:auto;
}
.log-row {
  display:flex;
  gap:10px;
  margin-bottom:4px;
  font-size:11px;
}
.empty {
  text-align:center;
  color:rgba(255,255,255,0.32);
  padding:20px;
}
@media(max-width:768px){
  .main {
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto 1fr 150px;
  }
  .queue { grid-column:1; }
  .harvester { grid-column:1; }
}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <div>ANTCPU · FACTORY</div>
  <div class="header-right">
    <div id="lastUpdate" style="color:rgba(255,255,255,0.32);font-size:11px;letter-spacing:1px"></div>
    <button onclick="refreshAll()">↺ REFRESH</button>
  </div>
</div>

<div class="summary">
  <div>PENDING <span id="sumPending" style="color:#F0C040">0</span></div>
  <div>APPROVED <span id="sumApproved" style="color:#00ffaa">0</span></div>
  <div>REJECTED <span id="sumRejected" style="color:#ff4444">0</span></div>
  <div>STAGED <span id="sumStaged" style="color:#60aaff">0</span></div>
  <div>UPLOADS <span id="sumUploads" style="color:#ff88cc">0</span></div>
  <div style="margin-left:auto">SERVER <span id="serverDot" class="status-dot"></span></div>
</div>

<div class="main">
  <div class="panel">
    <div class="panel-title">PENDING QUEUE</div>
    <div id="pCount" style="font-size:28px;color:#F0C040">0</div>
  </div>
  <div class="panel">
    <div class="panel-title">STAGED FILES</div>
    <div id="sCount" style="font-size:28px;color:#60aaff">0</div>
  </div>
  <div class="panel">
    <div class="panel-title">UPLOADS</div>
    <div id="uCount" style="font-size:28px;color:#ff88cc">0</div>
  </div>

  <div class="panel queue">
    <div class="panel-title">REVIEW QUEUE</div>
    <div id="queue"></div>
  </div>

  <div class="panel harvester">
    <div class="panel-title">HARVESTER LOG</div>
    <div id="log"></div>
  </div>
</div>

</div>
<script>
const BASE = "http://localhost:3000";
const agentColors = {
  antcpu:"#F0C040", forge:"#FF7A1A", scout:"#00ffaa", aria:"#B080FF",
  ledger:"#60aaff", herald:"#ff88cc", vault:"#aaaaaa",
  mac:"#ffffff", amanda:"#ffcc44", antcoin:"#F0C040"
};

async function refreshAll(){
  updateTime();
  await Promise.all([loadSummary(), loadQueue(), loadLog(), checkServer()]);
}

function updateTime(){
  document.getElementById("lastUpdate").innerText =
    new Date().toLocaleTimeString();
}

async function loadSummary(){
  try {
    const res = await fetch(BASE + "/api/super-gate/summary");
    const d = await res.json();
    const pq = d.pending_queue || {};
    const st = d.staging || {};
    const up = d.uploads || {};
    document.getElementById("sumPending").innerText  = pq.pending  || 0;
    document.getElementById("sumApproved").innerText = pq.approved || 0;
    document.getElementById("sumRejected").innerText = pq.rejected || 0;
    document.getElementById("sumStaged").innerText   = st.staged   || 0;
    document.getElementById("sumUploads").innerText  = up.pending  || 0;
    document.getElementById("pCount").innerText = pq.pending  || 0;
    document.getElementById("sCount").innerText = st.staged   || 0;
    document.getElementById("uCount").innerText = up.pending  || 0;
  } catch(e){}
}

async function checkServer(){
  try {
    await fetch(BASE + "/api/antcpu/status");
    document.getElementById("serverDot").style.background="#00ffaa";
  } catch {
    document.getElementById("serverDot").style.background="#ff4444";
  }
}

async function loadQueue(){
  try {
    const res = await fetch(BASE + "/api/super-gate/pending");
    const data = await res.json();
    const el = document.getElementById("queue");
    if(!data.length){
      el.innerHTML = "<div class='empty'>QUEUE CLEAR — no pending items</div>";
      return;
    }
    el.innerHTML = data.map(item => {
      const score = item.gate_score || 0;
      const scoreColor = score < 40 ? "#ff4444" : score < 70 ? "#F0C040" : "#00ffaa";
      const agentColor = agentColors[item.agent_id] || "#fff";
      let payload = "";
      try { payload = JSON.stringify(JSON.parse(item.payload)).slice(0,120); }
      catch(e) { payload = String(item.payload || "").slice(0,120); }
      return `
      <div class="card" id="card-${item.id}">
        <div>
          <span class="agent" style="color:${agentColor}">${(item.agent_id||"").toUpperCase()}</span>
          <span class="badge">${item.type || "—"}</span>
          <span class="score" style="color:${scoreColor}">${score}/99</span>
          <span style="color:rgba(255,255,255,0.32);font-size:10px;margin-left:8px">${item.created_at || ""}</span>
        </div>
        <div class="payload">${payload}</div>
        <div class="actions">
          <button class="btn-green" onclick="act('${item.id}','approve',this)">✅ APPROVE</button>
          <button class="btn-red"   onclick="act('${item.id}','reject',this)">❌ REJECT</button>
          <button class="btn-purple" onclick="act('${item.id}','inject',this)">🤖 INJECT</button>
        </div>
      </div>`;
    }).join("");
  } catch(e){}
}

async function act(id, type, btn){
  const card = document.getElementById("card-"+id);
  const btns = card.querySelectorAll("button");
  btns.forEach(b => b.classList.add("btn-loading"));
  try {
    const res = await fetch(`${BASE}/api/super-gate/${type}/${id}`, {method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    if(res.ok){
      card.classList.add("fade");
      setTimeout(()=>{ card.remove(); loadSummary(); }, 300);
    } else {
      card.classList.add("error");
      btns.forEach(b => b.classList.remove("btn-loading"));
    }
  } catch(e){
    card.classList.add("error");
    btns.forEach(b => b.classList.remove("btn-loading"));
  }
}

async function loadLog(){
  try {
    const res = await fetch(BASE + "/api/harvester-log");
    const data = await res.json();
    const rows = Array.isArray(data) ? data : (data.logs || []);
    document.getElementById("log").innerHTML = rows.slice(0,20).map(l => {
      let color = "rgba(255,255,255,0.5)";
      if(l.event==="blocker")            color="#FF7A1A";
      if(l.event==="insight")            color="#00ffaa";
      if(l.event==="contact_extracted")  color="#B080FF";
      if(l.event==="auto-rejected")      color="#ff4444";
      if(l.event==="agent_run")          color="rgba(255,255,255,0.4)";
      let dataStr = "";
      try { dataStr = JSON.stringify(JSON.parse(l.data)).slice(0,60); }
      catch(e) { dataStr = String(l.data||"").slice(0,60); }
      return `<div class="log-row" style="color:${color}">
        <div style="white-space:nowrap">${new Date(l.ts).toLocaleTimeString()}</div>
        <div style="white-space:nowrap;min-width:60px">${l.source||""}</div>
        <div style="white-space:nowrap;min-width:80px">${l.event||""}</div>
        <div style="color:rgba(255,255,255,0.3)">${dataStr}</div>
      </div>`;
    }).join("");
  } catch(e){}
}

let interval = setInterval(refreshAll, 15000);
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ clearInterval(interval); }
  else { refreshAll(); interval = setInterval(refreshAll, 15000); }
});

refreshAll();
</script>
</body>
</html>
