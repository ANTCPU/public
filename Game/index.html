<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐜</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>antcpu Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ant-green': '#00ff41',
              'ant-dark': '#0d1117',
              'ant-panel': '#161b22',
            },
            animation: {
              'drone-fly': 'fly 3s infinite ease-in-out',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'zoom-out-screen': 'zoomOutScreen 2.5s ease-in-out forwards',
              'credits-roll': 'creditsRoll 4s linear forwards',
              'float': 'float 6s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-down': 'slideDown 0.3s ease-out',
              'slide-up': 'slideUp 0.3s ease-out',
            },
            keyframes: {
              fly: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              zoomOutScreen: {
                '0%': { transform: 'scale(1)', opacity: '1' },
                '20%': { transform: 'scale(0.95)' },
                '100%': { transform: 'scale(0.3) translateY(100px)', opacity: '0' }
              },
              creditsRoll: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '20%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { transform: 'translateY(-150%)', opacity: '0' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0d1117;
        color: #e6edf3;
        font-family: 'Courier New', Courier, monospace;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0d1117; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #00ff41; }
      .will-change-transform { will-change: transform; }
      .text-shadow-glow { text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); }
      .perspective-1000 { perspective: 1000px; }
      .rotate-y-90 { transform: rotateY(90deg); }
      .rotate-y-0 { transform: rotateY(0deg); }
      .-rotate-y-90 { transform: rotateY(-90deg); }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>

</head>
