<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTCPU / public / images</title>
  <style>
    :root {
      --black:   #0a0a0a;
      --surface: #111111;
      --card:    #161616;
      --border:  #222222;
      --gold:    #c9a84c;
      --white:   #f2f2f2;
      --text:    #a0a0a0;
      --muted:   #555;
      --green:   #3ecf8e;
      --font:    'Inter', 'Segoe UI', system-ui, sans-serif;
      --r:       10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 860px; margin: 0 auto; }

    /* breadcrumb */
    .breadcrumb {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb a { color: var(--gold); text-decoration: none; }
    .breadcrumb a:hover { color: var(--white); }
    .breadcrumb span { color: var(--muted); }

    /* header */
    .header { margin-bottom: 32px; }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.01em;
    }
    .header p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    /* card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: #333;
      transform: translateY(-2px);
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: #0d0d0d;
    }
    .thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--muted);
    }
    .card-body {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .card-name {
      font-size: 0.78rem;
      color: var(--white);
      font-weight: 500;
      word-break: break-all;
      flex: 1;
    }
    .badge {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 100px;
      flex-shrink: 0;
    }
    .badge-jpg  { background: rgba(201,168,76,0.12); color: var(--gold); }
    .badge-png  { background: rgba(0,212,255,0.08);  color: #00d4ff; }
    .badge-heic { background: rgba(85,85,85,0.2);    color: var(--muted); }

    .card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    /* footer */
    .footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--white); }
  </style>
</head>
<body>
<div class="wrap">

  <div class="breadcrumb">
    <a href="https://github.com/ANTCPU/public">ANTCPU/public</a>
    <span>/</span>
    <span>images</span>
  </div>

  <div class="header">
    <h1>📁 images</h1>
    <p>6 files · public build assets</p>
  </div>

  <div class="grid">

    <a class="card-link card" href="https://raw.githubusercontent.com/ANTCPU/public/main/images/_e46295a8-c8e4-4505-bb59-0e9089f11754.jpg" target="_blank">
      <img class="thumb" src="https://raw.githubusercontent.com/ANTCPU/public/main/images/_e46295a8-c8e4-4505-bb59-0e9089f11754.jpg" alt="" loading="lazy">
      <div class="card-body">
        <span class="card-name">_e46295a8-c8e4-4505-bb59-0e9089f11754.jpg</span>
        <span class="badge badge-jpg">JPG</span>
      </div>
    </a>

    <a class="card-link card" href="https://raw.githubusercontent.com/ANTCPU/public/main/images/antcoin.jpg" target="_blank">
      <img class="thumb" src="https://raw.githubusercontent.com/ANTCPU/public/main/images/antcoin.jpg" alt="antcoin" loading="lazy">
      <div class="card-body">
        <span class="card-name">antcoin.jpg</span>
        <span class="badge badge-jpg">JPG</span>
      </div>
    </a>

    <a class="card-link card" href="https://raw.githubusercontent.com/ANTCPU/public/main/images/antcoin2026.png" target="_blank">
      <img class="thumb" src="https://raw.githubusercontent.com/ANTCPU/public/main/images/antcoin2026.png" alt="antcoin2026" loading="lazy">
      <div class="card-body">
        <span class="card-name">antcoin2026.png</span>
        <span class="badge badge-png">PNG</span>
      </div>
    </a>

    <a class="card-link card" href="https://raw.githubusercontent.com/ANTCPU/public/main/images/antcoinNodes.png" target="_blank">
      <img class="thumb" src="https://raw.githubusercontent.com/ANTCPU/public/main/images/antcoinNodes.png" alt="antcoinNodes" loading="lazy">
      <div class="card-body">
        <span class="card-name">antcoinNodes.png</span>
        <span class="badge badge-png">PNG</span>
      </div>
    </a>

    <a class="card-link card" href="https://raw.githubusercontent.com/ANTCPU/public/main/images/btc.heic" target="_blank">
      <div class="thumb-placeholder">🖼️</div>
      <div class="card-body">
        <span class="card-name">btc.heic</span>
        <span class="badge badge-heic">HEIC</span>
      </div>
    </a>

    <a class="card-link card" href="https://raw.githubusercontent.com/ANTCPU/public/main/images/coins.heic" target="_blank">
      <div class="thumb-placeholder">🖼️</div>
      <div class="card-body">
        <span class="card-name">coins.heic</span>
        <span class="badge badge-heic">HEIC</span>
      </div>
    </a>

  </div>

  <div class="footer">
    <span>ANTCPU / public / images</span>
    <a href="https://github.com/ANTCPU/public/tree/main/images">View on GitHub →</a>
  </div>

</div>
</body>
</html>
